name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Unit tests never open a connection — the Neon pool is lazy and only
      # presence of the variable is checked at import time.
      DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  db-tests:
    name: DB integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: thai_accounting_test
        # tmpfs for PGDATA, matching docker-compose.test.yml. The suite is
        # write-heavy DDL and throwaway data — durability buys nothing here and
        # fsyncing it to the runner's disk is the single biggest cost.
        options: >-
          --health-cmd "pg_isready -U test -d thai_accounting_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data:rw,size=1g
    env:
      # db-test-utils self-migrates from drizzle/*.sql — no db:migrate needed.
      TEST_DATABASE_URL: postgres://test:test@localhost:5433/thai_accounting_test
      DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
      DATABASE_URL_UNPOOLED: postgres://placeholder:placeholder@localhost:5432/placeholder
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cGxhY2Vob2xkZXItY2kuY2xlcmsuYWNjb3VudHMuZGV2JA
      CLERK_SECRET_KEY: sk_test_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e-gate:
    name: Check e2e secrets
    runs-on: ubuntu-latest
    outputs:
      run-e2e: ${{ steps.check.outputs.run-e2e }}
    steps:
      - id: check
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_E2E_PARENT_BRANCH: ${{ vars.NEON_E2E_PARENT_BRANCH }}
          E2E_CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_BLOB_READ_WRITE_TOKEN: ${{ secrets.E2E_BLOB_READ_WRITE_TOKEN }}
        run: |
          missing=""
          [ -n "$NEON_API_KEY" ] || missing="$missing secrets.NEON_API_KEY"
          [ -n "$NEON_PROJECT_ID" ] || missing="$missing vars.NEON_PROJECT_ID"
          [ -n "$NEON_E2E_PARENT_BRANCH" ] || missing="$missing vars.NEON_E2E_PARENT_BRANCH"
          [ -n "$E2E_CLERK_SECRET_KEY" ] || missing="$missing secrets.E2E_CLERK_SECRET_KEY"
          [ -n "$E2E_BLOB_READ_WRITE_TOKEN" ] || missing="$missing secrets.E2E_BLOB_READ_WRITE_TOKEN"
          if [ -z "$missing" ]; then
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-e2e=false" >> "$GITHUB_OUTPUT"
            echo "Skipping e2e — not configured:$missing" >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    name: Golden-path e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: e2e-gate
    if: needs.e2e-gate.outputs.run-e2e == 'true'
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.E2E_BLOB_READ_WRITE_TOKEN }}
      E2E_FAKE_AI: "1"
      E2E_REQUIRE_INNGEST: "1"
    steps:
      - uses: actions/checkout@v4
      # Each run gets its own copy-on-write branch of the e2e data. The org,
      # seed data and Clerk user come along for free, fixtures can't pollute
      # the parent, and runs no longer serialize on one shared branch.
      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          # No fallback on purpose: an unset parent would clone the project's
          # default branch, i.e. production. The gate skips the job instead.
          parent_branch: ${{ vars.NEON_E2E_PARENT_BRANCH }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          database: ${{ vars.NEON_DATABASE_NAME || 'neondb' }}
          role: ${{ vars.NEON_ROLE || 'neondb_owner' }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The branch is a clone, so it is already migrated — this only applies
      # migrations the PR itself adds.
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        # The browser download is known to hang after reaching 100% (CDN
        # stream stall) — bound each attempt and retry instead of letting
        # the job ride to its timeout.
        run: |
          pnpm exec playwright install-deps chromium
          for attempt in 1 2 3; do
            if timeout 300 pnpm exec playwright install chromium; then
              exit 0
            fi
            echo "playwright install attempt ${attempt} hung or failed; retrying" >&2
          done
          exit 1
      - name: Start Inngest dev server
        run: |
          pnpm dlx inngest-cli@1 dev -u http://localhost:3015/api/inngest --no-discovery > inngest.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8288 > /dev/null 2>&1; then
              echo "Inngest dev server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Inngest dev server failed to start" >&2
          cat inngest.log >&2
          exit 1
      # Golden path only. The other e2e specs are a local/manual suite — running
      # all 224 serially against the dev server takes >20 min and times the job out.
      # Playwright's webServer inherits this env, so the app gets the branch URL.
      - run: pnpm test:e2e e2e/golden-path
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload Inngest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inngest-log
          path: inngest.log
          retention-days: 14
      # always() — a failed or cancelled run must not leak its branch.
      - name: Delete Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
